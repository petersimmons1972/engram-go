name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: engram
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci-only-not-production' }}
          POSTGRES_DB: engram_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Mint app token for Duramind contract checkout
        id: duramind-app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ENGRAM_FLEET_CI_APP_ID }}
          private-key: ${{ secrets.ENGRAM_FLEET_CI_PRIVATE_KEY }}
          repositories: duramind
          permission-contents: read

      - name: Check out Duramind contract authority
        id: duramind-checkout
        if: ${{ steps.duramind-app-token.outcome == 'success' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: petersimmons1972/duramind
          path: .contract/duramind
          token: ${{ steps.duramind-app-token.outputs.token }}
          persist-credentials: false

      - name: Configure Duramind contract authority
        if: ${{ !cancelled() }}
        env:
          DURAMIND_CHECKOUT_OUTCOME: ${{ steps.duramind-checkout.outcome }}
        shell: bash
        run: |
          duramind_repo="${GITHUB_WORKSPACE}/.contract/duramind"
          duramind_source_dir="${duramind_repo}/internal/wp05c"
          duramind_source="${duramind_source_dir}/compare.go"

          if [[ "${DURAMIND_CHECKOUT_OUTCOME}" == "success" ]] &&
             [[ -d "${duramind_source_dir}" ]] &&
             [[ -f "${duramind_source}" ]]; then
            echo "DURAMIND_REPO=${duramind_repo}" >> "${GITHUB_ENV}"
          elif [[ "${DURAMIND_CHECKOUT_OUTCOME}" != "success" ]]; then
            echo "::warning::Duramind provider-side contract check did not run: authority checkout outcome was ${DURAMIND_CHECKOUT_OUTCOME}."
          else
            echo "::warning::Duramind provider-side contract check did not run: checkout succeeded but ${duramind_source} is missing."
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with coverage
        env:
          TEST_DATABASE_URL: postgres://engram:${{ secrets.CI_POSTGRES_PASSWORD || 'ci-only-not-production' }}@localhost:5432/engram_test?sslmode=disable
        run: go test -coverprofile=coverage.out ./...

      - name: Coverage gate (60% minimum)
        # #429 (the four t.Skip'd integration tests blocking this gate) is closed
        # and fixed: TestHandleMemoryRecall_IncludeConflicts_Integration,
        # TestFederatedRecall_IncludeConflicts_NotSilentlyDropped,
        # TestEmbedDeadline_RecallWithinMemory, and TestRetrievalTracking_PrecisionUpdated
        # all landed via PR #431 and PR #432 (#430 follow-up) and now only carry the
        # ordinary TEST_DATABASE_URL skip guard. Measured coverage with
        # TEST_DATABASE_URL set is 65.9%, confirmed clear of 60% before raising this
        # gate from the temporary 55% floor (#694).
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          awk "BEGIN { if (${COVERAGE}+0 < 60) { print \"FAIL: coverage \" ${COVERAGE} \"% is below the 60% threshold\"; exit 1 } else { print \"PASS: coverage \" ${COVERAGE} \"% meets the 60% threshold\" } }"

      - name: Vet
        run: go vet ./...

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.1

  checkin-lint:
    name: Checkin lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Run checkin-lint
        # --tracked: CI has no staged files; scan the whole tracked tree
        run: bin/checkin-lint.sh --tracked
